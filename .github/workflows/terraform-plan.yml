name: Terraform Plan

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to plan
        required: true
        type: choice
        options: [dev, test, prod]
      source_ref:
        description: Commit or branch to plan
        required: true
        default: main
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-state-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    env:
      ARM_USE_OIDC: true
      ARM_USE_AZUREAD: true
      ARM_USE_CLI: false
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    defaults:
      run:
        working-directory: environments/${{ inputs.environment }}

    steps:
      - name: Check out requested ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - name: Log in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Check Terraform formatting
        working-directory: .
        run: terraform fmt -check -recursive

      - name: Initialize Terraform
        run: terraform init -input=false -reconfigure

      - name: Validate Terraform configuration
        run: terraform validate

      - name: Record source commit
        env:
          PLAN_ENVIRONMENT: ${{ inputs.environment }}
          PLAN_SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          printf 'environment=%s\nsource_ref=%s\nsource_commit=%s\n' \
            "$PLAN_ENVIRONMENT" "$PLAN_SOURCE_REF" "$(git rev-parse HEAD)" > plan-metadata.txt

      - name: Create saved Terraform plan
        run: terraform plan -input=false -lock-timeout=5m -out=tfplan

      - name: Render plan summary
        run: terraform show -no-color tfplan > tfplan.txt

      - name: Publish plan summary
        run: cat tfplan.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload exact reviewed plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ inputs.environment }}-${{ github.run_id }}
          path: |
            environments/${{ inputs.environment }}/tfplan
            environments/${{ inputs.environment }}/tfplan.txt
            environments/${{ inputs.environment }}/plan-metadata.txt
          retention-days: 7